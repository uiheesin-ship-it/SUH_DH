# Market Regime Lab — 호스팅(무료 인스턴스)용 파라미터 오버라이드.
#
# render.yaml 의 suh-dh-regime 서비스가 SUH_DH_REGIME_CONFIG 로 이 파일을 가리킵니다.
# 여기 적지 않은 값은 코드의 내장 기본값(app/regime/config.py DEFAULTS = 저장소
# 루트 regime_config.yaml 과 동일)을 그대로 씁니다. 계산 방법은 바뀌지 않습니다.
forward:
  # 무료 인스턴스는 메모리가 512MB 입니다. baseline 의 block bootstrap 이 가장
  # 큰 배열을 만드는데(반복수 × 관측수), 2000회면 분석 한 번에 최대 ~350MB 를
  # 써서 위험합니다. 500회면 ~175MB 로 떨어지고 신뢰구간의 성질은 같습니다
  # (필요하면 사이드바에서 그때그때 올릴 수 있습니다).
  bootstrap_samples: 500
