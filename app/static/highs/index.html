<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미국 52주 신고가 대시보드 · SUH_DH</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
  <header class="topbar">
    <div class="title">
      <a href="../" class="home-link" title="대시보드 홈">⌂</a>
      <h1>🇺🇸 52주 신고가 대시보드</h1>
      <span id="demo-badge" class="badge demo hidden">DEMO 데이터</span>
    </div>
    <div class="controls">
      <span id="status" class="status">불러오는 중…</span>
      <label class="auto">
        <input type="checkbox" id="auto-toggle" checked />
        자동 새로고침
        <select id="auto-interval">
          <option value="30">30초</option>
          <option value="60" selected>1분</option>
          <option value="180">3분</option>
          <option value="300">5분</option>
        </select>
      </label>
      <button id="refresh-btn">새로고침</button>
    </div>
  </header>

  <div id="split">
    <!-- Left: the stock list -->
    <div id="list-pane">
      <main id="content">
        <div class="loading">데이터를 불러오는 중입니다…</div>
      </main>
      <footer class="footer">
        데이터 출처: Finviz (신고가 스크리닝) · Yahoo Finance (차트/뉴스). 무료 소스는 약 15분 지연될 수 있습니다.
      </footer>
    </div>

    <!-- Draggable divider -->
    <div id="divider" class="hidden" title="좌우로 끌어 너비 조절"></div>

    <!-- Right: the chart, slides in -->
    <aside id="chart-pane" class="hidden">
      <div class="chart-head">
        <div class="chart-title">
          <span id="chart-ticker" class="chart-ticker"></span>
          <span id="chart-company" class="chart-company"></span>
        </div>
        <div class="chart-actions">
          <a id="chart-external" href="#" target="_blank" rel="noopener" class="ext-link">Yahoo ↗</a>
          <button id="chart-close" class="close" title="닫기">✕</button>
        </div>
      </div>
      <div id="chart-area" class="chart-area"></div>
      <div class="legend">
        <span class="lg vol">거래량</span>
        <span class="lg ma5">MA5</span>
        <span class="lg ma20">MA20</span>
        <span class="lg ma50">MA50</span>
        <span class="lg ma120">MA120</span>
        <span class="hint">· 드래그로 좌우 이동 · 휠로 확대/축소 · 더블클릭 시 전체기간</span>
      </div>
    </aside>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
