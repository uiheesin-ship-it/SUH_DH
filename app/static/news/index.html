<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글로벌 투자 뉴스 · SUH_DH</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">
      <a href="../" class="home-link" title="대시보드 홈">⌂</a>
      <h1>🌐 글로벌 투자 뉴스</h1>
      <span id="demo-badge" class="badge demo hidden">DEMO 데이터</span>
    </div>
    <div class="controls">
      <span id="status" class="status">불러오는 중…</span>
      <label class="auto">
        <input type="checkbox" id="auto-toggle" checked />
        자동 새로고침
        <select id="auto-interval">
          <option value="300">5분</option>
          <option value="600" selected>10분</option>
          <option value="1800">30분</option>
        </select>
      </label>
      <button id="refresh-btn">새로고침</button>
    </div>
  </header>

  <main id="content">
    <div class="loading">뉴스를 불러오는 중입니다…</div>
  </main>

  <footer class="footer">
    출처: Reuters · Bloomberg · FT · WSJ · CNBC · Nikkei (각 기사 원문 링크 첨부).
    투자 관련성 높은 뉴스만 선별해 한국어로 요약합니다. 요약·번역은 자동 생성되어 부정확할 수 있으니 원문을 확인하세요.
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
