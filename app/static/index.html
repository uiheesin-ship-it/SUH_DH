<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대시보드 · SUH_DH</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <header class="hub-top">
    <h1>📊 SUH_DH 대시보드</h1>
    <p class="sub">투자/리서치 프로그램 모음. 카드를 눌러 들어가세요.</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer class="hub-foot">
    새 프로그램을 추가하려면 <code>app/static/index.html</code> 의
    <code>APPS</code> 배열에 항목 하나만 추가하면 됩니다.
  </footer>

  <script>
    // 프로그램 레지스트리 — 새 프로그램은 여기 한 줄만 추가.
    const APPS = [
      {
        name: "미국 52주 신고가",
        emoji: "🇺🇸",
        desc: "미장 마감 후 52주 신고가 종목을 섹터·소섹터별, 시총순으로. 상승 이유(뉴스·실적)와 이평선 차트 포함.",
        href: "highs/",
        status: "ready",
      },
      {
        name: "AI 투자 뉴스",
        emoji: "🤖",
        desc: "AI·반도체·데이터센터·전력/에너지·로보틱스 등 AI 생태계 뉴스만 선별. 무료 매체 우선, 하루 10~20건, 한국어 1~2줄 요약 + 원문 링크.",
        href: "news/",
        status: "ready",
      },
      {
        name: "실적 발표 전후 주가 반응",
        emoji: "📈",
        desc: "티커별 실적 발표일 기준 직전1일·D+1·D+7·D+30·D+60 주가 수익률과 분기 평균. EPS 컨센서스 상회 여부 + 차분기 가이던스 vs 컨센서스(있는 경우)도 한 표에.",
        href: "earnings/",
        status: "ready",
      },
      // 예) { name: "급등 거래량 스캐너", emoji: "🔥", desc: "...", href: "/volume/", status: "soon" },
    ];

    const grid = document.getElementById("grid");
    grid.innerHTML = APPS.map((a) => {
      const soon = a.status === "soon";
      const inner = `
        <div class="card-emoji">${a.emoji}</div>
        <div class="card-body">
          <div class="card-name">${a.name}${soon ? '<span class="soon">준비중</span>' : ""}</div>
          <div class="card-desc">${a.desc}</div>
        </div>
        <div class="card-go">${soon ? "" : "열기 →"}</div>`;
      return soon
        ? `<div class="card disabled">${inner}</div>`
        : `<a class="card" href="${a.href}">${inner}</a>`;
    }).join("");
  </script>
</body>
</html>
