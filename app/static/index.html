<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대시보드 · SUH_DH</title>
  <link rel="stylesheet" href="hub.css?v=2" />
</head>
<body>
  <header class="hub-top">
    <h1>📊 SUH_DH 대시보드</h1>
    <p class="sub">시장(미장·국장) × 종류(신고가·스크리너·분석Tool·기타)로 정렬했습니다. 카드를 눌러 들어가세요.</p>
  </header>

  <main id="board"></main>

  <footer class="hub-foot">
    새 프로그램을 추가하려면 <code>app/static/index.html</code> 의
    <code>APPS</code> 배열에 항목 하나만 추가하면 됩니다.
    <code>market</code>(<code>us</code>/<code>kr</code>)과
    <code>group</code>(<code>highs</code>/<code>screener</code>/<code>tool</code>/<code>other</code>)으로 자리가 정해집니다.
    <code>status: "hidden"</code> 으로 두면 카드만 감춰집니다(프로그램은 그대로 배포).
  </footer>

  <script>
    // 프로그램 레지스트리 — 새 프로그램은 여기 한 줄만 추가.
    //   market: "us"(미장) | "kr"(국장)
    //   group : "highs"(신고가) | "screener"(스크리너) | "other"(기타)
    //   status: "ready"(정상) | "soon"(준비중 — 회색 카드) | "hidden"(허브에서 감춤)
    // market·group 두 값이 대시보드에서 카드가 놓일 칸(행 × 열)을 결정합니다.
    // "hidden" 은 카드만 안 보일 뿐 프로그램은 그대로 배포되므로 href 주소로
    // 직접 들어갈 수 있습니다. 지우지 않고 감추는 쪽이라 되돌리기도 한 글자입니다.

        href: "highs/",
        status: "ready",
      },
      {

        href: "base/",
        status: "ready",
      },
      {
        name: "평평 스크리너",

        href: "flat/",
        status: "ready",
      },
      {
        name: "턴어라운드 스크리너",
        emoji: "🌅",
        market: "us", group: "screener",
        desc: "바닥권에서 건전한 베이스(평평·VCP·컵·이름 없는 모양 모두)를 만들고 그 오른쪽 끝에 와 있는 종목. 베이스 스크리너는 상승추세를 요구해 200일선 아래를 못 보고, 평평 스크리너는 평평도가 필수라 VCP·컵 바닥 베이스를 놓치는데, 그 사이 구멍을 메웁니다. 유형 대신 품질 4축(수축·지지·마름·응집)으로 채점하고, 실적 전환은 점수에서 빼되 다음 실적까지 D-day를 제공 — 실적이 드러난 뒤엔 차트가 이미 뻗어 있기 때문. 밝은 테마.",
        href: "turnaround/",
        status: "ready",
      },
      {
        name: "미장 마켓 브레스",
        emoji: "🌡️",
        market: "us", group: "tool",
        desc: "지수 말고 '얼마나 많은 종목이 같이 가는가'. S&P500·나스닥의 20/50/200일선 위 종목 비율, NYSE 등락종목·신고가−신저가·상승하락 거래량, 동일가중(RSP/SPY)·VIX 기간구조·하이일드 스프레드까지 한 화면에. 0~100 종합점수와 레짐(위험/주의/중립/양호/과열), '지수는 신고가인데 브레스는 하락' 같은 다이버전스 경고를 자동 판정. 값은 TradingView·Yahoo·FRED에서 받아오고 실패 시 구성종목으로 직접 계산.",
        href: "breadth/",
        status: "hidden",
      },
      {
        name: "티커 상관관계",
        emoji: "🔗",
        market: "us", group: "tool",
        desc: "티커 하나를 넣으면 같이 움직이는 종목을 찾아 줍니다. 시장(SPY) 움직임을 걷어낸 '잔차 상관'을 같이 계산해, 테마와 무관한 고베타 대형주가 상위권을 채우는 문제를 피합니다 — 잔차 내림차순이 '이 테마가 갈 때 같이 가는 종목', 원시 오름차순이 헤지 후보. 20·50·120거래일 세 기간을 모두 열로 실어 기간별 차이도 봅니다. 가격이 아니라 일간 수익률 기준. 열 정렬·섹터 필터·같은 섹터 제외 포함.",
        href: "correl/",
        status: "ready",
      },
      {
        name: "분기 실적 · 12M Forward PER",
        emoji: "📒",
        market: "us", group: "tool",
        desc: "티커 하나를 넣으면 EDGAR XBRL 원본에서 최근 5년 분기 실적(매출·영업이익·순이익·EBITDA·희석EPS·주식수)을 YoY·QoQ와 함께 뽑고, 주가와 12M forward PER을 겹쳐 그립니다. PER 계단은 재무정보 기준일이 아니라 실적발표일에 밟습니다 — 기준일로 밟으면 아직 공개되지 않은 실적으로 그 사이 주가를 나누게 되기 때문. 확정 실적만으로 계산된 구간은 실선, 증권사 컨센서스가 섞인 구간은 점선이고 차트에 두 날짜를 모두 표시합니다. 미리 모으지 않고 입력한 티커만 그때 받아옵니다.",
        href: "quarterly/",
        status: "ready",
      },
      {
        name: "AI 투자 뉴스",
        emoji: "🤖",
        market: "us", group: "other",
        desc: "AI·반도체·데이터센터·전력/에너지·로보틱스 등 AI 생태계 뉴스만 선별. 무료 매체 우선, 하루 10~20건, 한국어 1~2줄 요약 + 원문 링크.",
        href: "news/",
        status: "ready",
      },
      {
        name: "실적 발표 전후 주가 반응",
        emoji: "📈",
        market: "us", group: "tool",
        desc: "티커별 실적 발표일 기준 직전1일·D+1·D+7·D+30·D+60 주가 수익률과 분기 평균. EPS 컨센서스 상회 여부 + 차분기 가이던스 vs 컨센서스(있는 경우)도 한 표에.",
        href: "earnings/",
        status: "ready",
      },
      {
        name: "실적 컨콜 투자 테마",
        emoji: "📞",
        market: "us", group: "other",
        desc: "미국 주요 기업 실적발표 컨퍼런스콜을 LLM으로 구조화·분석. 경영진 내러티브 톤과 실제 KPI·가이던스 변화를 분리 평가하고, 여러 기업·밸류체인의 공통/상충 신호를 종합해 산업·투자 테마를 발굴. 모든 결론에 회사·분기·발언자·문단 ID·영어 원문 근거 연결. 매일 자동 갱신(현재 6개 기업 Prototype).",
        href: "eai/",
        status: "ready",
      },
      {
        name: "Market Regime (Local 실행 필요)",
        emoji: "🧪",
        market: "us", group: "tool",
        desc: "지금 시장이 어떤 상태인지(추세·모멘텀·변동성·분산일·10년물)를 숫자로 정의하고, 20년 안에서 가장 비슷했던 과거 날짜를 찾아 그 이후 5/20/60/120거래일 수익률 분포를 봅니다. 겹치는 표본을 감안한 cluster bootstrap 신뢰구간, 계산 과정을 전부 펼쳐 보는 감사 화면, walk-forward 검증 포함. 자동 내려받기 대신 화면에서 CSV/XLSX 를 직접 올려 쓸 수도 있습니다(업로드 파일은 저장·커밋되지 않고 그 세션에서만 사용).",
        href: "regime/",
        status: "ready",
      },
      {
        name: "국장 52주 신고가",
        emoji: "🇰🇷",
        market: "kr", group: "highs",
        desc: "KOSPI·KOSDAQ 보통주 중 52주 신고가 종목을 섹터·시총순으로. 스팩·ETF·우선주 제외, 시총 1,500억원 이상. 이평선 차트 포함. (미장 신고가의 국장 버전)",
        href: "krhighs/",
        status: "ready",
      },
      {
        name: "국장 60일 신고가",
        emoji: "📅",
        market: "kr", group: "highs",
        desc: "KOSPI·KOSDAQ 보통주 중 최근 60거래일(약 3개월) 신고가 종목을 섹터·시총순으로. 조건은 52주 버전과 동일(스팩·ETF·우선주 제외, 시총 1,500억원 이상), 기간만 60거래일. 이평선 차트 포함.",
        href: "krhighs60/",
        status: "ready",
      },
      {
        name: "국장 베이스 스크리너",
        emoji: "🧭",
        market: "kr", group: "screener",
        desc: "미장 베이스 스크리너의 국장 버전. KOSPI·KOSDAQ 보통주를 Minervini 추세+베이스/VCP/거래량/RS로 100점 채점. RS는 코스피·코스닥 지수 대비. SMA·베이스·피봇 오버레이 차트 포함.",
        href: "krbase/",
        status: "ready",
      },
      {
        name: "한국 실적 전후 주가",
        emoji: "📊",
        market: "kr", group: "tool",
        desc: "국내 종목의 실적 발표일 기준 D-7·직전1일·D+1·D+7·D+30·D+60 상승률과 분기 평균만 간단히. 컨센서스·EPS 없이 주가 반응만.",
        href: "kr/",
        status: "ready",
      },
      {
        name: "한국 수주잔고",
        emoji: "🏗️",
        market: "kr", group: "tool",
        desc: "분기별로 수주잔고를 공시하는 회사(건설·조선·방산·기계·플랜트·SI 등)의 최근 1개년 분기별 수주잔고 추이. 출처는 DART 정기보고서 본문 '수주상황' 표. 전분기·전년 대비 증감과 원문 링크 포함. 보고서 제출 시에만 갱신되어 매일 그날 제출분만 확인.",
        href: "backlog/",
        status: "ready",
      },
      // 예) { name: "급등 거래량 스캐너", emoji: "🔥", market: "us", group: "screener", desc: "...", href: "volume/", status: "soon" },
    ];

    const MARKETS = [
      { key: "us", label: "미장", emoji: "🇺🇸", note: "US · NYSE/NASDAQ" },
      { key: "kr", label: "국장", emoji: "🇰🇷", note: "KR · KOSPI/KOSDAQ" },
    ];
    const GROUPS = [
      { key: "highs", label: "신고가" },
      { key: "screener", label: "스크리너" },
      // 분석Tool = 종목을 걸러 주는 게 아니라, 무언가를 재고 따져 보는 도구.
      { key: "tool", label: "분석Tool" },
      // 기타 = 읽을거리(뉴스·리서치 요약)처럼 위 셋에 안 들어가는 것.
      { key: "other", label: "기타" },
    ];

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function cardHtml(a) {
      const soon = a.status === "soon";
      // Full text as the tooltip: the descriptions are long and the card body
      // clamps them, so hovering is how you read the rest without a detail page.
      const inner = `
        <div class="card-top">
          <span class="card-emoji">${a.emoji}</span>
          <span class="card-name">${esc(a.name)}${soon ? '<span class="soon">준비중</span>' : ""}</span>
        </div>
        <div class="card-desc">${esc(a.desc)}</div>
        <div class="card-go">${soon ? "" : "열기 →"}</div>`;
      return soon
        ? `<div class="card disabled" title="${esc(a.desc)}">${inner}</div>`
        : `<a class="card" href="${a.href}" title="${esc(a.desc)}">${inner}</a>`;
    }

    // Unknown/missing market or group falls back to 미장·기타 rather than being
    // dropped, so a new entry that forgets a field still shows up somewhere.
    const keyOf = (val, list, fallback) =>
      list.some((g) => g.key === val) ? val : fallback;

    // status:"hidden" 은 목록에서 빼되 레지스트리에는 남겨 둔다.
    const VISIBLE = APPS.filter((a) => a.status !== "hidden");

    document.getElementById("board").innerHTML = MARKETS.map((m) => {
      const mine = VISIBLE.filter((a) => keyOf(a.market, MARKETS, "us") === m.key);
      if (!mine.length) return "";
      // 열은 시장마다 네 개를 그대로 둔다 — 미장·국장의 자리가 같아야 눈이 덜 헤맨다.
      // 아직 카드가 없는 열은 비워 두되, 고장 난 것처럼 보이지 않게 자리만 표시한다.
      const cols = GROUPS.map((g) => {
        const cards = mine.filter((a) => keyOf(a.group, GROUPS, "other") === g.key);
        const body = cards.length
          ? cards.map(cardHtml).join("")
          : '<p class="col-empty">아직 없습니다</p>';
        return `<section class="col">
            <h3 class="col-head">${g.label}<span class="col-count">${cards.length}</span></h3>
            <div class="col-cards">${body}</div>
          </section>`;
      }).join("");
      return `<section class="market market-${m.key}">
          <div class="market-head">
            <span class="market-emoji">${m.emoji}</span>
            <h2>${m.label}</h2>
            <span class="market-note">${m.note}</span>
            <span class="rule"></span>
          </div>
          <div class="cols">${cols}</div>
        </section>`;
    }).join("");

    /* 백엔드 미리 깨우기 ------------------------------------------------------
     *
     * Market Regime Lab 은 계산을 호스팅된 FastAPI 백엔드에서 한다. 무료 인스턴스는
     * 15분만 놀아도 잠들어서, 카드를 누른 뒤에야 깨우기 시작하면 첫 화면에서 30~60초를
     * 기다리게 된다. 대시보드를 여는 순간 한 번 찔러 두면 카드를 고르는 동안 깨어난다.
     * 응답은 쓰지 않고(실패해도 무시), 다른 프로그램에는 아무 영향이 없다.
     */
    (function prewarmBackend() {
      let base = "";
      try { base = localStorage.getItem("suh_dh_regime_api") || ""; } catch (e) { /* 프라이빗 모드 */ }
      const ping = (url) => {
        if (!url) return;
        fetch(url.replace(/\/+$/, "") + "/api/health", { cache: "no-store", mode: "no-cors" })
          .catch(() => {});
      };
      if (base) { ping(base); return; }
      // 저장된 주소가 없으면 regime 프로그램의 설정에서 기본 주소를 읽어 온다.
      fetch("regime/config.js", { cache: "no-store" })
        .then((r) => (r.ok ? r.text() : ""))
        .then((text) => {
          for (const name of ["SUH_DH_API_BASE", "SUH_DH_REGIME_API_DEFAULT"]) {
            const m = text.match(new RegExp(name + '\\s*=\\s*"([^"]+)"'));
            if (m && m[1]) { ping(m[1]); return; }
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
