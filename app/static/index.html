<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>대시보드 · SUH_DH</title>
  <link rel="stylesheet" href="hub.css" />
</head>
<body>
  <header class="hub-top">
    <h1>📊 SUH_DH 대시보드</h1>
    <p class="sub">투자/리서치 프로그램 모음. 카드를 눌러 들어가세요.</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer class="hub-foot">
    새 프로그램을 추가하려면 <code>app/static/index.html</code> 의
    <code>APPS</code> 배열에 항목 하나만 추가하면 됩니다.
  </footer>

  <script>
    // 프로그램 레지스트리 — 새 프로그램은 여기 한 줄만 추가.
    const APPS = [
      {
        name: "미국 52주 신고가",
        emoji: "🇺🇸",
        desc: "미장 마감 후 52주 신고가 종목을 섹터·소섹터별, 시총순으로. 상승 이유(뉴스·실적)와 이평선 차트 포함.",
        href: "highs/",
        status: "ready",
      },
      {
        name: "AI 투자 뉴스",
        emoji: "🤖",
        desc: "AI·반도체·데이터센터·전력/에너지·로보틱스 등 AI 생태계 뉴스만 선별. 무료 매체 우선, 하루 10~20건, 한국어 1~2줄 요약 + 원문 링크.",
        href: "news/",
        status: "ready",
      },
      {
        name: "실적 발표 전후 주가 반응",
        emoji: "📈",
        desc: "티커별 실적 발표일 기준 직전1일·D+1·D+7·D+30·D+60 주가 수익률과 분기 평균. EPS 컨센서스 상회 여부 + 차분기 가이던스 vs 컨센서스(있는 경우)도 한 표에.",
        href: "earnings/",
        status: "ready",
      },
      {
        name: "한국 실적 전후 주가",
        emoji: "🇰🇷",
        desc: "국내 종목의 실적 발표일 기준 D-7·직전1일·D+1·D+7·D+30·D+60 상승률과 분기 평균만 간단히. 컨센서스·EPS 없이 주가 반응만.",
        href: "kr/",
        status: "ready",
      },
      {
        name: "베이스 스크리너",
        emoji: "🧭",
        desc: "Minervini 추세 템플릿 + 베이스/VCP/변동성 축소/거래량 감소/RS 라인/섹터 강세를 정량화해 100점으로 채점한 watchlist. 종목별 SMA·베이스·피봇 오버레이 차트와 ready/breakout 알림 포함.",
        href: "base/",
        status: "ready",
      },
      {
        name: "국장 52주 신고가",
        emoji: "🇰🇷",
        desc: "KOSPI·KOSDAQ 보통주 중 52주 신고가 종목을 섹터·시총순으로. 스팩·ETF·우선주 제외, 시총 1,500억원 이상. 이평선 차트 포함. (미장 신고가의 국장 버전)",
        href: "krhighs/",
        status: "ready",
      },
      {
        name: "국장 베이스 스크리너",
        emoji: "🇰🇷",
        desc: "미장 베이스 스크리너의 국장 버전. KOSPI·KOSDAQ 보통주를 Minervini 추세+베이스/VCP/거래량/RS로 100점 채점. RS는 코스피·코스닥 지수 대비. SMA·베이스·피봇 오버레이 차트 포함.",
        href: "krbase/",
        status: "ready",
      },
      {
        name: "한국 수주잔고",
        emoji: "🇰🇷",
        desc: "분기별로 수주잔고를 공시하는 회사(건설·조선·방산·기계·플랜트·SI 등)의 최근 1개년 분기별 수주잔고 추이. 출처는 DART 정기보고서 본문 '수주상황' 표. 전분기·전년 대비 증감과 원문 링크 포함. 보고서 제출 시에만 갱신되어 매일 그날 제출분만 확인.",
        href: "backlog/",
        status: "ready",
      },
      // 예) { name: "급등 거래량 스캐너", emoji: "🔥", desc: "...", href: "/volume/", status: "soon" },
    ];

    const grid = document.getElementById("grid");
    grid.innerHTML = APPS.map((a) => {
      const soon = a.status === "soon";
      const inner = `
        <div class="card-emoji">${a.emoji}</div>
        <div class="card-body">
          <div class="card-name">${a.name}${soon ? '<span class="soon">준비중</span>' : ""}</div>
          <div class="card-desc">${a.desc}</div>
        </div>
        <div class="card-go">${soon ? "" : "열기 →"}</div>`;
      return soon
        ? `<div class="card disabled">${inner}</div>`
        : `<a class="card" href="${a.href}">${inner}</a>`;
    }).join("");
  </script>
</body>
</html>
