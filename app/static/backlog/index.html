<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국 수주잔고 · SUH_DH</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title">
      <a href="../" class="home-link" title="대시보드 홈">⌂</a>
      <h1>🇰🇷 한국 수주잔고</h1>
      <span id="demo-badge" class="badge demo hidden">DEMO 데이터</span>
    </div>
    <div class="controls">
      <input id="search" class="search" type="search" placeholder="회사·코드 검색" />
      <select id="sector" class="sector"><option value="">전체 섹터</option></select>
      <span id="status" class="status">불러오는 중…</span>
      <button id="refresh-btn">새로고침</button>
    </div>
  </header>

  <main id="content">
    <div class="loading">데이터를 불러오는 중입니다…</div>
  </main>

  <footer class="footer">
    분기별로 <b>수주잔고를 공시하는 회사</b>(건설·조선·방산·기계·플랜트·SI 등)의 최근
    수주잔고 추이입니다. 출처: <b>DART 전자공시</b> 정기보고서(분기·반기·사업보고서)
    본문 '수주상황' 표에서 추출. 회사마다 표 양식이 달라 근사치이며, 각 행의
    <b>DART ↗</b> 링크로 원문을 확인하세요. 수주잔고는 보고서 제출 시에만 바뀌므로
    매일 그날 제출된 보고서만 갱신합니다.
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
