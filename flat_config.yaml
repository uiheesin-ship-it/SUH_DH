# =====================================================================
# 평평 스크리너(Flat Base Screener) 설정
# app/flat/config.py 가 이 파일을 읽고, 없으면 코드 내 기본값(DEFAULTS)을 씁니다.
# 값을 바꾸면 다음 스캔(빌드 또는 /api/flat 호출)부터 반영됩니다.
#
# 원칙: 이 스크리너의 점수(Flatness Score)는 "지금 베이스가 얼마나 평평한가"
# 만을 잽니다. 거래량/ATR/VCP/이동평균/RS/섹터/펀더멘털은 계산하지 않습니다.
# 과거 활동성(Historical Activity)은 점수와 완전히 별개로 계산합니다.
# =====================================================================

# --- 대상 유니버스 (§2) ---------------------------------------------
universe:
  source: finviz
  include_reit: false     # REIT 제외(기본). true 로 바꾸면 포함
  include_adr: true       # ADR 포함 여부
  max_candidates: 1500    # OHLCV 정밀분석 최대 후보 수(초과 시 시총 균등표본)

# 필터는 저가주 컷이 아니라 '시총'으로 품질을 거릅니다. 최저주가는 서브-$1
# 페니주 데이터 오류만 막는 최소값($1)이고, 실제 종목 걸러내기는 시총이 담당.
min_price: 1.0                     # 주가 1달러 미만 제외(데이터 노이즈 방지용 최소값)
min_market_cap: 300000000          # 시총 3억 달러(소형주) 미만 제외
min_avg_dollar_volume_20d: 10000000  # 최근 20일 평균 거래대금 1,000만 달러 미만 제외
min_history_days: 180              # 베이스+과거활동성 분리에 필요한 최소 히스토리

# --- 베이스 유지 여부 판정 밴드 (§6) --------------------------------
status:
  lower_mult: 0.97        # current >= Q10 * 0.97 이면 하단 유지
  upper_mult: 1.03        # current <= Q90 * 1.03 이면 상단 유지
  exclude_recent_days: 0  # >0 이면 상태판정 Q10/Q90에서 최근 N일 제외

# --- 기간별 평평도 기준 (§5) ----------------------------------------
# 종목의 베이스 길이 n 에 따라 아래 버킷 중 max_len 이 n 이상인 첫 버킷 적용
thresholds:
  short:                  # 20~40 거래일
    max_len: 40
    close_band: 0.12
    base_drift: 0.06
    containment: 0.80
    center_shift: 0.06
    outlier_ratio: 0.05
  mid:                    # 41~80 거래일
    max_len: 80
    close_band: 0.18
    base_drift: 0.08
    containment: 0.80
    center_shift: 0.07
    outlier_ratio: 0.05
  long:                   # 81~120 거래일
    max_len: 120
    close_band: 0.22
    base_drift: 0.10
    containment: 0.80
    center_shift: 0.08
    outlier_ratio: 0.05

# --- 이전 추세 태그 (§7) --------------------------------------------
prior_trend:
  lookbacks: [60, 120]    # 베이스 시작 직전 60/120일 수익률
  continuation_min: 0.20  # 대표수익률 >= +20% → Continuation
  turnaround_max: -0.20   # 대표수익률 <= -20% → Turnaround (그 사이는 Neutral)

# --- 카테고리별 추가 허용 기준 (§8) ---------------------------------
acceptance:
  continuation:
    min_len: 20
    min_score: 70
  turnaround_neutral:     # Neutral / Turnaround 는 더 엄격
    min_len: 40
    min_score: 80
    min_containment: 0.85
    max_drift: 0.05
    max_center_shift: 0.05
    require_historical_activity: true

# --- Historical Activity Filter (§9) — 베이스 시작 이전 데이터만 사용 -
historical_activity:
  prior_short_window: 120
  prior_long_window: 252
  min_prior_120_close_band: 0.20    # 조건1: 이전 120일 close band ≥ 20%
  min_max_abs_move: 0.15            # 조건2: 이전 252일 내 최대 |20/60일 수익률| ≥ 15%
  min_base_distinctness: 1.5        # 조건3: 이전 252일 band ≥ 현재 base band × 1.5
  max_abs_lookbacks: [20, 60]

# --- Chronically Low Volatility 제외 (§10) --------------------------
chronic_low_vol:
  max_prior_252_close_band: 0.20
  max_abs_20d: 0.12
  max_abs_60d: 0.12
  max_base_distinctness: 1.3

# --- Flatness Score 배점 (§11) — 합계 100 ---------------------------
score:
  range_weight: 35          # Close Band Tightness
  slope_weight: 25          # Regression Slope Flatness
  containment_weight: 20    # Close Containment
  center_weight: 10         # First-half vs Second-half Stability
  outlier_weight: 10        # Outlier Control
  containment_floor: 0.60   # containment 점수 램프 시작
  containment_span: 0.30    # 0.60→0.90 사이에서 0→만점
  outlier_scale: 0.05       # outlier_ratio 5%에서 0점

# --- 등급 컷 (§12) ---------------------------------------------------
grades:
  very_flat: 85
  flat: 75
  moderate: 65

# 종목별로 보여줄 상위 후보 기간 수 (§17)
top_candidates: 3
