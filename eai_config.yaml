# --- MVP 신뢰도 게이트 (요구 §11-6, §23) -----------------------------
# 6개 기업 단계에서는 High Conviction 테마를 만들지 않고 Prototype 표기.
maturity:
  high_conviction_min_companies: 20
  mvp_label: "Prototype / Insufficient Breadth"
