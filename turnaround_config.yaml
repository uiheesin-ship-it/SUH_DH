# =====================================================================
# 턴어라운드 스크리너(Bottom Base Screener) 설정
# app/turnaround/config.py 가 이 파일을 읽고, 없으면 코드 내 기본값(DEFAULTS)을 씁니다.
# 값을 바꾸면 다음 스캔(빌드 또는 /api/turnaround 호출)부터 반영됩니다.
#
# 원칙: 이 스크리너는 "이미 턴한 종목"이 아니라 "바닥권에서 건전한 베이스를
# 만들고 있고, 그 베이스의 오른쪽 끝에 와 있는 종목"을 찾습니다.
# 실적 전환은 판정에 넣지 않습니다(실적이 나온 뒤엔 차트가 이미 뻗어 있음).
# 대신 '다음 실적까지 D-day'를 열로 제공합니다.
#
# 베이스 유형(평평/VCP/컵/불규칙)은 미리 정의하지 않습니다. 유형별로 분기하면
# 딱 그 유형만 잡히고 나머지가 전부 빠집니다. 대신 유형 불문 품질 4축
# (수축·지지·마름·응집)으로 채점합니다.
# =====================================================================

# --- 대상 유니버스 ---------------------------------------------------
# 이동평균 필터를 일부러 넣지 않습니다. 이 스크리너는 200일선 '아래'가 본진이고,
# 거기는 베이스 스크리너의 finviz 사전필터(price_above_sma50/200)가 안 보는 곳.
# ETF/REIT는 제외 — 턴어라운드는 개별 기업 스토리라 바스켓은 의미가 없습니다.
universe:
  source: finviz
  include_adr: true       # ADR 포함 여부
  max_candidates: 3000    # OHLCV 정밀분석 최대 후보 수(초과 시 시총 균등표본)

min_price: 1.0                      # 서브-$1 페니주 데이터 노이즈 방지용 최소값
min_market_cap: 300000000           # 시총 3억 달러(소형주) 미만 제외
min_avg_dollar_volume_20d: 6000000  # 최근 20일 평균 거래대금 600만 달러 미만 제외
min_history_days: 300               # 베이스(≤120) + 저점 탐색(252)에 필요한 최소 히스토리
# 베이스 구간 평균 |일간수익률|이 이 값 미만이면 '딜 고정/정지'로 보고 제외.
min_base_daily_vol: 0.005

# --- 바닥권 게이트: "실제로 떨어졌는가" -------------------------------
bottom:
  # 낙폭을 재는 고점 창(거래일). 일부러 1년보다 깁니다 — 베이스가 1년 넘게
  # 이어지면 하락 전 고점이 252일 창 밖으로 밀려나서, 낙폭을 '베이스 안에서
  # 만들어진 고점' 대비로 재게 됩니다. 그러면 제일 잘 다져진 장기 바닥
  # 베이스가 오히려 '낙폭 부족'으로 탈락합니다.
  high_lookback: 756
  # 그 고점 대비 최소 낙폭. 베이스 스크리너의 min_price_vs_52w_high(0.75)를
  # 정확히 뒤집은 값입니다. 이 값을 낮추면 베이스 스크리너와 결과가 겹칩니다.
  min_off_52w_high: 0.30
  # ...단 저점 대비 이미 2배(+100%) 났으면 바닥권이 아님 → 제외
  max_off_52w_low: 1.00
  # 칼날 배제: 최근 N일의 저점이 그 이전 구간의 저점을 밑돌면 제외.
  # '52주 저점 근처인가'가 아니라 '신저가를 만들고 있는가'로 물어야 합니다 —
  # 저점 부근에 평평하게 눌러앉은 베이스는 52주 저점을 계속 다시 찍기 때문에
  # 전자로 물으면 영원히 제외됩니다.
  no_new_low_days: 20
  new_low_tolerance: 0.01

# --- 저점(trough) 앵커 ------------------------------------------------
trough:
  lookback: 252
  # 정확한 최솟값(argmin) 대신 '최저가의 N% 이내 첫 도달일'을 저점으로 봅니다.
  # 이중바닥($10.00 → $9.98)에서 argmin은 오른쪽 저점을 잡는데, 그건 실제
  # 바닥이 형성된 시점이 아니기 때문.
  tolerance: 0.03

# --- 베이스 창 탐지 ---------------------------------------------------
base:
  min_length_days: 20
  max_length_days: 120
  min_depth: 0.05
  max_depth: 0.40         # 바닥 베이스는 본래 깊음(베이스 스크리너는 0.35)
  # 저점이 베이스 구간의 앞쪽 몇 %에 있어야 하는지. 저점이 뒤쪽 30%에 있으면
  # 아직 신저가를 만드는 중이지 다지는 중이 아님.
  # 예) 60일 베이스면 저점이 1~42일차에 있어야 통과 (42/60 = 0.70)
  low_early_frac: 0.70
  # '하락 구간을 삼킨 창' 배제: 마지막 종가가 그 창의 고저 범위에서 어디에
  # 있는지. 하락을 삼킨 창은 오른쪽이 바닥에 붙은 낮은 선반이라 0.4 근처가
  # 나오고, 진짜 오른쪽 끝(평평 베이스든 컵의 우측이든)은 0.8 이상이 나옴.
  # 앞 1/3 기울기로는 이 판별을 못 합니다 — 정상적인 컵의 좌측 하강도 같이
  # 걸려서 손잡이컵·라운딩 바텀이 전부 탈락하기 때문.
  min_recovery: 0.45
  # 베이스는 옆으로 갑니다. 수직 상승 구간을 잘라낸 창은 위 조건을 전부
  # 통과해버려요(저점이 왼쪽, 현재가가 고점, 깊이도 적당). 회귀 드리프트로
  # 명시적으로 걸러야 합니다.
  max_drift: 0.20

# --- 베이스 품질 40점 — 저점 이후 구간에서만 계산 ----------------------
# 저점 이후로만 계산하는 게 핵심 방어장치입니다. 베이스 시작점을 조금 잘못
# 잡아도 하락 구간이 지표에 섞이지 않습니다.
quality:
  contraction_weight: 12   # 후반 range < 전반 range (VCP든 평평이든 공통)
  support_weight: 10       # higher-low, 저점 미갱신
  dryup_weight: 10         # 거래량 마름
  containment_weight: 8    # 종가 응집도
  contraction_full: 0.60   # 후반/전반 range 비율 0.60 이하면 만점
  contraction_zero: 1.00   # 1.00 이상이면 0점
  dryup_full: 0.65         # 최근10일 거래량 / 50일 평균
  dryup_zero: 1.10
  containment_floor: 0.60  # 중앙값 ±7.5% 안에 든 종가 비율
  containment_span: 0.30

# --- 오른쪽 끝 30점 (이 스크리너의 목표) ------------------------------
edge:
  # 유효 pivot = 베이스 고점과 최근 레지(핸들) 고점 중 '가까운 쪽'.
  # 깊은 바닥 베이스는 자기 고점이 30% 위라 그걸로만 보면 ready가 영영 안 뜸.
  ledge_lookback: 15
  ready_threshold: 0.05    # pivot 5% 이내 → ready
  watch_threshold: 0.12    # 12% 이내 → watch
  min_position: 0.50       # 베이스 밴드 내 위치(0=하단, 1=상단) 최소값
  position_full: 0.85
  tighten_full: 0.60       # 최근10일 평균 range / 베이스 평균 range
  tighten_zero: 1.10
  max_extension: 0.15      # 베이스 고점 +15% 초과 → 이미 뻗음, 제외
  # 창과 무관한 두 번째 '뻗음' 판정. 어떤 창을 그리든 50일선에서 이만큼
  # 떨어져 있으면 이미 움직인 것. 베이스 스크리너의 inbase.sma50_stretch(1.12)와
  # alerts.extended_sma50_ratio(1.20) 사이 값 — 타이트한 베이스에서 갓 갭상승한
  # 종목은 살리고, 이어진 상승은 떨어내는 지점.
  max_sma50_stretch: 1.18
  extension_zero: 0.08     # pivot +8% 지점에서 준비도 0점
  weights:
    distance: 0.40         # 유효 pivot까지 거리
    position: 0.30         # 베이스 밴드 내 위치
    tighten: 0.30          # 오른쪽 끝이 조여지는가

# --- 바닥 셋업 20점: 하락이 실제로 끝났는가 ---------------------------
setup:
  slope_lookback_fast: 20
  slope_lookback_slow: 40
  # 200일선 기울기는 아직 (-)여도 되지만 완만해져 있어야 함.
  slope200_zero: -0.10     # 40일간 -10% → 0점
  slope200_full: 0.00      # 평탄하거나 상승 → 만점
  slope50_zero: -0.08
  slope50_full: 0.02
  weights:
    decel: 0.35            # 200일선 기울기 완만화/전환
    ma_recover: 0.35       # 50/200일선 회복 정도
    rs_repair: 0.30        # RS 라인이 더는 저점을 안 깨는가
  rs_repair_full: 0.08     # RS 라인이 베이스 저점 대비 +8% → 만점

# --- 첫 방향 전환 트리거 10점 ------------------------------------------
# 점수보다 배지/알림 용도. '트리거 발생 + 아직 extended 아님'이 핵심 조합.
triggers:
  fresh_days: 5              # 발생 후 N일 이내면 '신선'
  power_bar_vol_mult: 2.5    # 거래량 ≥ 50일평균 × 2.5
  power_bar_min_ret: 0.05    # + 종가 +5%↑
  power_bar_close_loc: 0.70  # + 당일 range 상단 30%에서 마감
  earnings_gap_min: 0.05     # 실적일 당일/익일 +5%↑
  earnings_gap_vol_mult: 3.0
  earnings_window_days: 2    # D+0/D+1을 실적 반응으로 봄
  pocket_pivot_lookback: 10
  reclaim_below_days: 60     # 200일선 아래 N일 이상 있다가 첫 회복
  score: 10

# --- 총점 배분(합계 100) ----------------------------------------------
score:
  edge_weight: 30       # 오른쪽 끝 (목표가 여기라 배점 최대)
  quality_weight: 40    # 베이스 품질 4축
  setup_weight: 20      # 바닥 셋업
  trigger_weight: 10    # 첫 방향 전환

grades:
  prime: 80
  high: 68
  watch: 55

# --- 다음 실적까지 D-day 열 -------------------------------------------
# "바닥 베이스 오른쪽 끝 + 실적 임박"이 이 스크리너의 핵심 필터.
earnings:
  enabled: true
  max_lookup: 120       # 점수 상위 N개만 조회(종목당 네트워크 호출 1회)
