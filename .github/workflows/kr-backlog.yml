name: Refresh KR order backlog (DART)

# Keeps data/kr_backlog.json up to date with Korean quarterly 수주잔고 from
# OpenDART. Two ways to run:
#
#   * Daily cron (incremental)  — ONE market-wide list.json sweep finds the day's
#     periodic-report filers and parses only those. Cheap: order backlog changes
#     only when a company files a periodic report, so we never scan the whole
#     ~2,600-name market. Commits the refreshed JSON, which the dashboard build
#     then publishes to GitHub Pages.
#   * Manual "backfill"         — one-time full sweep to discover which firms
#     disclose backlog and seed ~1 year of history. Run this once first.
#
# Needs the repo secret DART_API_KEY (free key from https://opendart.fss.or.kr).
on:
  schedule:
    # 14:00 UTC = 23:00 KST — after the Korean filing day, so a day's periodic
    # reports are in. --days 2 overlaps so nothing is missed around midnight.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental (daily) or backfill (one-time full sweep)"
        type: choice
        options: [incremental, backfill]
        default: incremental
      days:
        description: "incremental window in days"
        required: false
        default: "10"
      max_docs:
        description: "incremental: max report docs per run (caps deadline-day spikes; resumes next run)"
        required: false
        default: "250"
      limit:
        description: "backfill: cap tickers scanned (0 = all; use e.g. 300 to test)"
        required: false
        default: "0"
      dart_key:
        description: "OpenDART key for a one-off run (leave blank to use the DART_API_KEY secret; the daily cron needs the secret)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: "kr-backlog"
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Commit into the deploy/default branch so the dashboard build picks
          # the refreshed backlog up (same target as kr-dates.yml).
          ref: claude/funny-carson-ent3s7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        # FinanceDataReader supplies the 업종(sector) map used to group the
        # dashboard table; without it every company falls back to 기타. DART
        # fetch/parse itself is stdlib-only (app/dartdoc), so this is the only dep.
        run: pip install finance-datareader
      - name: Fetch KR order backlog from DART
        env:
          # Accept an inline one-off key, else the DART_API_KEY secret, else the
          # DART_API secret (some repos named it that way).
          DART_API_KEY: ${{ github.event.inputs.dart_key != '' && github.event.inputs.dart_key || secrets.DART_API_KEY || secrets.DART_API }}
          MODE: ${{ github.event.inputs.mode || 'incremental' }}
          # Wide default window so a report-deadline cluster stays in range while
          # --max-docs chews through it over several nightly runs (seen-set skips
          # already-fetched filings, so re-listing is cheap).
          DAYS: ${{ github.event.inputs.days || '10' }}
          MAX_DOCS: ${{ github.event.inputs.max_docs || '250' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          if [ "$MODE" = "backfill" ]; then
            python tools/kr_dart_backlog.py --backfill --limit "$LIMIT"
          else
            python tools/kr_dart_backlog.py --days "$DAYS" --max-docs "$MAX_DOCS"
          fi
      - name: Commit updated backlog
        run: |
          if [ -n "$(git status --porcelain data/kr_backlog.json data/dart_corp.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/kr_backlog.json data/dart_corp.json
            git commit -m "data(kr): refresh order backlog from DART"
            for i in 1 2 3 4 5; do
              git push origin HEAD:claude/funny-carson-ent3s7 && break
              echo "push rejected; rebasing (attempt $i) ..."
              git fetch origin claude/funny-carson-ent3s7
              git rebase -X ours origin/claude/funny-carson-ent3s7 || git rebase --abort
              sleep 3
            done
          else
            echo "No backlog changes."
          fi
