name: Collect DART split decisions

# Pulls 회사분할결정 / 회사분할합병결정 (structured) from OpenDART for a ticker over a
# date range and dumps every field to data/dart_split.json. Run from Actions.
# Needs the repo secret DART_API_KEY (or paste one into dart_key at run time).
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "6-digit code"
        required: true
        default: "035720"
      bgn:
        description: "From date (YYYYMMDD)"
        required: true
        default: "20260801"
      end:
        description: "To date (YYYYMMDD)"
        required: true
        default: "20260831"
      dart_key:
        description: "OpenDART API key (blank = use DART_API_KEY secret)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-carson-ent3s7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect split decisions from DART
        env:
          DART_API_KEY: ${{ github.event.inputs.dart_key != '' && github.event.inputs.dart_key || secrets.DART_API_KEY }}
        run: python tools/dart_split.py "${{ github.event.inputs.ticker }}" "${{ github.event.inputs.bgn }}" "${{ github.event.inputs.end }}"
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: dart-split
          path: data/dart_split.json
      - name: Commit JSON
        run: |
          if [ -n "$(git status --porcelain data/dart_split.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/dart_split.json
            git commit -m "data(dart): collect split decision"
            for i in 1 2 3 4 5; do
              git push origin HEAD:claude/funny-carson-ent3s7 && break
              git fetch origin claude/funny-carson-ent3s7
              git rebase -X ours origin/claude/funny-carson-ent3s7 || git rebase --abort
              sleep 3
            done
          else
            echo "No changes."
          fi
