name: Build & deploy dashboard

# Updates the dashboard every weekday after the US market close and on every
# push. You can also run it manually from the Actions tab ("Run workflow").
on:
  schedule:
    # 21:30 UTC Mon-Fri = ~06:30 KST next morning (after US close, year-round).
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: ["claude/funny-carson-ent3s7"]
    paths-ignore:
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; only keep the latest queued one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build static site
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
