name: Build & deploy dashboard

# Updates the dashboard every weekday after the US market close and on every
# push. You can also run it manually from the Actions tab ("Run workflow").
on:
  schedule:
    # Refresh news (and the dashboard) every 6 hours so the digest — and the
    # Telegram channel that mirrors it — stays reasonably fresh.
    # 00:30 / 06:30 / 12:30 / 18:30 UTC.
    - cron: "30 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: ["claude/funny-carson-ent3s7"]
    paths-ignore:
      - "README.md"
      # The Telegram job commits sent-state every 30 min; don't rebuild the site for that.
      - "state/**"
      # This workflow commits the digest here; don't let that re-trigger itself.
      - "data/**"

permissions:
  # Write access so the build can commit data/news.json for the Telegram job.
  contents: write
  pages: write
  id-token: write

# Let a running deploy finish; only keep the latest queued one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build static site
        run: python build.py
        env:
          # Optional: set this repo Variable to your hosted backend URL (e.g. a
          # Render service) so the static earnings page can query any ticker.
          SUH_DH_API_BASE: ${{ vars.SUH_DH_API_BASE }}
      - name: Commit news.json for the Telegram job
        # This commit is only for the Telegram mirror — never let a race on this
        # branch (the Telegram job pushes here too) block the Pages deploy.
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "chore: update dashboard news.json"
            # The Telegram job commits to this same branch on its own cadence.
            # Retry, auto-resolving news.json in favor of this fresh build.
            for i in 1 2 3 4 5; do
              git push origin HEAD:claude/funny-carson-ent3s7 && break
              echo "push rejected; rebasing (attempt $i) ..."
              git fetch origin claude/funny-carson-ent3s7
              git rebase -X ours origin/claude/funny-carson-ent3s7 || git rebase --abort
              sleep 3
            done
          else
            echo "news.json unchanged."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
