name: Build & deploy dashboard

# Updates the dashboard every weekday after the US market close and on every
# push. You can also run it manually from the Actions tab ("Run workflow").
on:
  schedule:
    # Refresh news (and the dashboard) every 6 hours so the digest — and the
    # Telegram channel that mirrors it — stays reasonably fresh.
    # 00:30 / 06:30 / 12:30 / 18:30 UTC. Base is NOT rescanned here (see
    # SUH_DH_SKIP_BASE below); these runs reuse the last committed base.json.
    - cron: "30 */6 * * *"
    # Extra refreshes every 30 min through the US trading session so the
    # 52-week-high list stays fresh while the market is actually moving (that's
    # the only time it changes). 13:00–22:00 UTC Mon–Fri ≈ 22:00 KST → 07:00 KST,
    # covering the session open→close+settle in both EST and EDT. No daytime-KST
    # runs — the US market is closed then, so nothing would change anyway.
    # These runs skip the heavy base rescan (see SUH_DH_SKIP_BASE below) so they
    # finish in ~15 min; they still rebuild the highs list AND reuse the latest
    # committed base.json, so the base screen also shows here (just not rescanned).
    - cron: "*/30 13-22 * * 1-5"
    # Base screener rescan — heavy (~10-20 min), so run it only twice a day at
    # the moments it's most useful, on US trading days:
    #   12:00 UTC = 21:00 KST  → US pre-market (reflects some pre-open action)
    #   22:00 UTC = 07:00 KST  → just after the US regular-session close
    # These are full builds (base NOT skipped) that commit the refreshed
    # base.json; every other run above then reuses it.
    - cron: "0 12,22 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: ["claude/funny-carson-ent3s7"]
    paths-ignore:
      - "README.md"
      # The Telegram job commits sent-state every 30 min; don't rebuild for that.
      - "state/**"
      # This workflow commits the news digest here; ignore only that file so it
      # doesn't re-trigger itself — but DO rebuild for data/guidance.json edits.
      - "data/news.json"
      # Ditto the persisted base-screener snapshot (committed on scheduled scans);
      # reused as-is on push builds, so a change to it must not loop the build.
      - "data/base.json"
      # And the persisted flat-base-screener snapshot.
      - "data/flat.json"
      # Same for the persisted Korean 52-week-high snapshot.
      - "data/krhighs.json"
      # And the Korean 60-trading-day-high snapshot.
      - "data/krhighs60.json"
      # And the persisted Korean base-screener snapshot.
      - "data/krbase.json"

permissions:
  # Write access so the build can commit data/news.json for the Telegram job.
  contents: write
  pages: write
  id-token: write

# Let a running deploy finish; only keep the latest queued one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Build static site
        run: python build.py
        env:
          # Optional: set this repo Variable to your hosted backend URL (e.g. a
          # Render service) so the static earnings page can query any ticker.
          SUH_DH_API_BASE: ${{ vars.SUH_DH_API_BASE }}
          # Base rescan (the heaviest step) runs ONLY on the twice-daily base
          # cron (0 12,22) and on manual dispatch. Every other scheduled run —
          # the 6-hourly news cron and the 30-min intraday highs cron — skips it
          # and reuses the last committed base.json, so those builds stay fast.
          SUH_DH_SKIP_BASE: ${{ (github.event.schedule == '*/30 13-22 * * 1-5' || github.event.schedule == '30 */6 * * *') && '1' || '' }}
      - name: Commit news.json for the Telegram job
        # This commit mirrors the news digest (for Telegram) and persists the
        # base-screener snapshot (so push builds can skip the heavy rescan).
        # Never let a race on this branch (the Telegram job pushes here too)
        # block the Pages deploy.
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/news.json data/base.json data/flat.json data/krhighs.json data/krhighs60.json data/krbase.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/news.json data/base.json data/flat.json data/krhighs.json data/krhighs60.json data/krbase.json
            git commit -m "chore: update dashboard data (news, base, flat, KR highs, KR base)"
            # The Telegram job commits to this same branch on its own cadence.
            # Retry, auto-resolving in favor of this fresh build.
            for i in 1 2 3 4 5; do
              git push origin HEAD:claude/funny-carson-ent3s7 && break
              echo "push rejected; rebasing (attempt $i) ..."
              git fetch origin claude/funny-carson-ent3s7
              git rebase -X ours origin/claude/funny-carson-ent3s7 || git rebase --abort
              sleep 3
            done
          else
            echo "news.json unchanged."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
