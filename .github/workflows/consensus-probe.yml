name: Consensus source probe

# 12M forward PER 에 필요한 컨센을 무료로 얼마나 받을 수 있는지 실측한다.
# 측정 전용 — 스냅샷을 만들지도, 커밋하지도, 배포를 막지도 않는다.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "확인할 티커(공백 구분). 비우면 기본 8종목"
        default: ""

permissions:
  contents: read

concurrency:
  group: consensus-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet yfinance pandas curl_cffi
      - name: Probe
        # 영업이익·순이익 컨센은 야후에 없다. 이 저장소가 이미 들고 있는 두 키로
        # FMP·Alpha Vantage 를 열어 본다(실적 컨콜 수집에 쓰던 키다). 키가 없으면
        # 그 부분만 건너뛴다. 키 자체는 로그에 찍지 않는다.
        env:
          EAI_TRANSCRIPT_API_KEY: ${{ secrets.EAI_TRANSCRIPT_API_KEY }}
          EAI_ALPHAVANTAGE_API_KEY: ${{ secrets.EAI_ALPHAVANTAGE_API_KEY }}
        run: python tools/consensus_probe.py ${{ github.event.inputs.tickers }}

      - name: Basis probe (GAAP vs 조정 · EV/EBITDA 재료)
        # forward PER 의 확정 구간은 EDGAR 의 GAAP EPS, 추정 구간은 야후 컨센인데
        # 애널리스트는 조정(non-GAAP) EPS 를 추정한다. 기준이 섞여 있다는 뜻이라
        # 과거 조정 EPS 와 정규화 손익, EV 재료를 받을 수 있는지 잰다.
        run: python tools/basis_probe.py ${{ github.event.inputs.tickers }}

      - name: EV probe (EDGAR 에 부채·현금 태그가 있나)
        # 야후 분기 재무상태표는 7분기뿐이라 5년을 그리려면 EDGAR 를 써야 한다.
        # 회사마다 태그가 달라서 어느 것이 몇 분기나 잡히는지 잰다.
        run: python tools/ev_probe.py ${{ github.event.inputs.tickers }}

      - name: EV/EBITDA build probe (파이프라인 전체)
        # 규칙은 단위 테스트가 못 박지만 실제 회사의 태그 조합은 여기서만 보인다.
        # 선이 그려지는지, 오늘 EV 가 야후와 얼마나 벌어지는지, 없는 버킷이
        # 무엇인지 — 셋을 같이 찍는다.
        run: python tools/ev_build_probe.py ${{ github.event.inputs.tickers }}
