# 백엔드(FastAPI)가 새 코드로 떴는지 확인하고, 필요하면 배포를 건다.
#
# 왜 필요한가. 실제 백엔드(https://suh-dh.onrender.com)는 Render 에서 **수동으로**
# 만든 서비스라 이 저장소의 render.yaml 이 적용되지 않는다. 그래서 무엇이 언제
# 배포되는지가 저장소 밖(Render 대시보드 설정)에 있고, 여기서는 안 보인다.
# 실제로 백엔드가 **210커밋·나흘치**나 뒤처져 있었는데 아무도 몰랐다 — 화면이
# HTTP 404 를 낼 때까지.
#
# 그래서 이 워크플로는 **확인을 먼저** 한다. 배포 훅이 없어도 확인은 늘 돈다.
# 확인은 Render 를 안 쓰므로 빌드 시간을 먹지 않는다.
#
#   확인  /openapi.json 에 app/main.py 의 라우트가 다 실려 있나
#   배포  RENDER_DEPLOY_HOOK_URL 시크릿이 있으면 훅을 호출(없으면 안내만)
#
# 배포 훅을 쓰려면(선택):
#   Render → 서비스 → Settings → Deploy Hook → 주소 복사 → 저장소
#   Settings → Secrets and variables → Actions → **Secrets** 탭 →
#   RENDER_DEPLOY_HOOK_URL (키가 들어 있는 주소라 Variables 가 아니다)
#
# 어느 커밋에서 배포할지는 Render 대시보드의 **Build Filters** 가 정한다
# (Ignored Paths: data/** state/** docs/** site/** *.md). 커밋 메시지의
# [skip render] 는 쓰지 않는다 — 그건 경로를 안 보고 푸시 전체를 건너뛰어서
# 데이터 커밋이 코드 배포를 묻어 버린다.
name: Check backend deploy

on:
  push:
    branches: ["claude/funny-carson-ent3s7"]
    paths:
      - "app/**"
      - "requirements.txt"
      - "render.yaml"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Trigger the deploy (배포 훅이 있을 때만)
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL 시크릿이 없습니다 — 배포는 Render 의 Auto-Deploy 에 맡기고, 여기서는 확인만 합니다."
            echo "fired=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK" || echo 000)
          echo "deploy hook -> $code"
          case "$code" in
            200|201) echo "fired=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::배포 훅이 $code 를 냈습니다 — 시크릿 주소를 확인하세요."
               echo "fired=0" >> "$GITHUB_OUTPUT" ;;
          esac

      # 배포가 끝났는지를 **라우트로** 확인한다. /api/health 는 코드가 바뀌어도
      # 같은 답을 주므로 "떴다"는 알려 줘도 "새 코드다"는 알려 주지 않는다.
      # FastAPI 가 /openapi.json 에 실제 서빙 중인 경로 목록을 실어 준다.
      - name: Is the backend running this code?
        env:
          FIRED: ${{ steps.hook.outputs.fired }}
        run: |
          URL="${{ vars.SUH_DH_API_BASE }}"
          [ -n "$URL" ] || URL=$(sed -n 's/.*SUH_DH_REGIME_API_DEFAULT *= *"\([^"]*\)".*/\1/p' \
                                 app/static/regime/config.js | head -1)
          URL="${URL%/}"
          if [ -z "$URL" ]; then
            echo "::notice::백엔드 주소를 모릅니다 — 확인을 건너뜁니다."
            exit 0
          fi
          # app/main.py 가 직접 다는 라우트만 본다(하위 라우터는 자체 프리픽스를 쓴다).
          want=$(grep -oP '@app\.(get|post)\("\K[^"]+' app/main.py | sort -u)
          echo "확인할 라우트 $(echo "$want" | wc -l)개 · 대상 $URL"
          # 훅을 걸었으면 빌드가 끝나기를 기다린다. 안 걸었으면 한 번만 보고 끝낸다
          # (무료 인스턴스는 잠들어 있을 수 있으므로 깨울 시간은 준다).
          tries=1; [ "$FIRED" = "1" ] && tries=20
          for i in $(seq 1 $tries); do
            [ "$i" = "1" ] || sleep 30
            body=$(curl -sS --max-time 120 "$URL/openapi.json" || true)
            if ! printf '%s' "$body" | grep -q '"paths"'; then
              echo "  ($i) 응답 없음"
              continue
            fi
            missing=""
            for p in $want; do
              printf '%s' "$body" | grep -q "\"$p\"" || missing="$missing $p"
            done
            if [ -z "$missing" ]; then
              echo "✅ 백엔드가 이 코드로 돌고 있습니다 — 라우트 전부 확인"
              exit 0
            fi
            echo "  ($i) 아직 없는 라우트:$missing"
          done
          echo "::warning::백엔드가 아직 옛 코드입니다. 없는 라우트:$missing"
          echo "::warning::Render 대시보드 → SUH_DH → Events 를 확인하세요. 'run out of pipeline minutes' 라면 빌드 시간이 바닥난 것이라 리셋 전까지는 어떤 배포도 되지 않습니다."
