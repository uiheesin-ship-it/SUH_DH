name: Fetch US ticker correlations

# 미장 티커 상관관계 수집 → data/correl.json.
#
# 주 3회, 미국장 마감 뒤에 돈다 — 월·수·금 21:40 UTC(마감 1시간 40분 뒤).
#
# 처음엔 수·토 주 2회였다. "상관은 천천히 변하니 매일 돌릴 이유가 없다"는 게
# 근거였는데, **평균적으로만** 맞는 말이었다. 수요일 낮에 열어 보면 지난 금요일
# 종가 기준이라 월·화·수 3거래일이 빠져 있었다. 상관이 깨지는 순간을 보려는
# 화면인데, 정작 크게 움직인 그 하루가 빠지는 게 문제다.
#
# 월·수·금으로 두면 **최대 1거래일**만 뒤처진다(화요일에 보면 월요일 종가 기준,
# 목요일에 보면 수요일 종가 기준, 주말엔 금요일 종가 기준 — 주말은 장이 없으니
# 뒤처진 게 아니다). 매일까지 안 간 이유는 돈이 아니라(public 레포라 Actions
# 시간은 무료) 1.3MB 파일이 매번 커밋돼 깃 저장소가 불어나기 때문이다.
#
# 무거운 건 계산이 아니라 가격 수신이다: 계산은 1초대, 수신이 2시간 남짓.
# 시크릿 불필요(Yahoo 만 읽는다. Finviz 메타는 열리면 덧붙이고 막히면 건너뛴다).
on:
  schedule:
    - cron: "40 21 * * 1,3,5"  # 월·수·금 21:40 UTC = 17:40 ET(마감 후) = 06:40 KST 익일
  workflow_dispatch:
    inputs:
      limit:
        description: "유니버스 상한(0 = 전체). 빠른 점검용"
        default: "0"
      min_dollar_vol:
        description: "최소 60일 평균 거래대금(백만 달러). 높일수록 종목이 줄고 파일이 작아집니다"
        default: "10"

permissions:
  contents: write

concurrency:
  group: correl
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 다른 데이터 워크플로와 같은 브랜치를 본다(배포본과 raw 경로가 여기다).
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-carson-ent3s7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet yfinance pandas numpy curl_cffi finvizfinance pyyaml
      - name: Fetch correlations
        run: |
          python tools/correl_us.py \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --min-dollar-vol "${{ github.event.inputs.min_dollar_vol || '10' }}"
      - name: Commit JSON
        run: |
          if [ -n "$(git status --porcelain data/correl.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/correl.json
            git commit -m "data(correl): refresh US ticker correlations"
            for i in 1 2 3 4 5; do
              git push origin HEAD:claude/funny-carson-ent3s7 && break
              git fetch origin claude/funny-carson-ent3s7
              git rebase -X ours origin/claude/funny-carson-ent3s7 || git rebase --abort
              sleep 3
            done
          else
            echo "No changes."
          fi
