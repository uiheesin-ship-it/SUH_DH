# 국장 분기 실적·컨센을 어디서 받을 수 있는지 실측한다.
#
# 미장은 EDGAR(실적) + 야후(컨센)로 풀렸다. 국장은 그 두 자리에 무엇이 들어갈지가
# 전부라, 짓기 전에 잰다. 측정 전용 — 스냅샷을 만들지도, 커밋하지도, 배포를
# 막지도 않는다. 판단이 끝나면 지워도 된다.
name: KR fundamentals source probe

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "확인할 종목코드(공백 구분). 비우면 기본 6종목"
        default: ""
      only:
        description: "한 출처만 볼 때 — naver / dart / dart5(5년 이력+발표일) / fnguide / web"
        default: ""

permissions:
  contents: read

concurrency:
  group: kr-fundamentals-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python tools/kr_fundamentals_probe.py \
            ${{ github.event.inputs.only && format('--only={0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.tickers }}
