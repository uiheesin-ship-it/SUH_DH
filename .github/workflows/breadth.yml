name: Fetch US market breadth

# 미장 마켓 브레스 수집 → data/breadth_us.json(시계열) + data/breadth.json(뷰).
#
# ⏸ 자동 수집 중단됨 (2026-09-14).
#   TradingView 에서 티커로 직접 확인하는 편이 낫다는 판단이라 프로그램을 허브에서
#   감췄고(app/static/index.html 의 status:"hidden") 매일 돌던 크론도 뺐다.
#   수동 실행(Run workflow)만 남겨 둔다 — 파이프라인이 아직 도는지 확인하거나
#   다시 켜기 전에 한 번 돌려 볼 때를 위해서.
#
#   다시 켜려면: 아래 schedule 블록의 주석을 풀면 된다(평일 21:10 UTC =
#   뉴욕 17:10 EDT / 16:10 EST, 정규장 마감과 데이터 확정 이후).
#   단, 멈춰 있던 기간만큼 시계열에 구멍이 남는다 — period 를 길게 줘서
#   한 번 돌리면 구성종목 계산분(%>이평선·A/D·신고가)은 과거까지 다시 채워진다.
#
# 시크릿은 필요 없다(Yahoo 만 읽는다).
on:
  # schedule:
  #   - cron: "10 21 * * 1-5"   # 평일 장 마감 후
  workflow_dispatch:
    inputs:
      period:
        description: "받아올 과거 기간(길수록 시계열이 길어지지만 느립니다)"
        type: choice
        default: "2y"
        options: ["2y", "5y", "10y"]

permissions:
  contents: write

concurrency:
  group: breadth
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # 다른 데이터 워크플로와 같은 브랜치를 본다. 배포되는 사이트와
      # app/static/shared/data-source.js 의 raw 경로가 모두 이 브랜치다.
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-carson-ent3s7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet yfinance pandas numpy curl_cffi
      - name: Fetch breadth
        # 구성종목 직접 계산이 기본 경로다(S&P 500 + 나스닥 100 종가 다운로드).
        # 5~7분 걸리지만 과거 시계열까지 매번 다시 채우므로 결측이 남지 않는다.
        run: python tools/breadth_us.py --period "${{ github.event.inputs.period || '2y' }}"
      - name: Commit JSON
        run: |
          if [ -n "$(git status --porcelain data/breadth_us.json data/breadth.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/breadth_us.json data/breadth.json
            git commit -m "data(breadth): refresh US market breadth [skip render]"
            for i in 1 2 3 4 5; do
              git push origin HEAD:claude/funny-carson-ent3s7 && break
              git fetch origin claude/funny-carson-ent3s7
              git rebase -X ours origin/claude/funny-carson-ent3s7 || git rebase --abort
              sleep 3
            done
          else
            echo "No changes."
          fi
