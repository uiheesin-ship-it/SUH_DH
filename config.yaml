# =====================================================================
# Base Screener 설정 — "건전한 베이스" 스크리너의 모든 임계값을 여기서 조정.
# app/base/config.py 가 이 파일을 읽고, 없으면 코드 내 기본값을 씁니다.
# 값을 바꾸면 다음 스캔(빌드 또는 /api/base 호출)부터 반영됩니다.
# =====================================================================

# --- 대상 유니버스 ---------------------------------------------------
universe:
  source: finviz          # finviz(권장) | index
  include_adr: true       # ADR 포함 여부
  include_etf: true       # ETF 포함(별도 조회, 레버리지·인버스는 제외). false 로 끄기
  max_etf_candidates: 700  # ETF 전용 후보 상한(주식 수를 밀어내지 않도록 분리)
  # OHLCV 를 받아 정밀분석할 최대 후보 수. 상한을 넘으면 시총 구간 전체에서
  # 고르게 표본을 뽑아 대형만 남지 않게 함(초대형주 편향 방지).
  # 주식수 거래량 필터를 뺐더니 유니버스가 커져서(고가 저거래주 포함), 표본추출로
  # 종목이 다시 누락되지 않도록 상한을 넉넉히 잡음. (스캔 시간은 늘어남)
  max_candidates: 3000
  # Finviz 1차필터(스크리너에서 미리 걸러 후보를 줄임).
  finviz_price_above_sma50: true
  finviz_price_above_sma200: true

# --- 1차 유동성 필터(정밀분석 후 최종 적용) --------------------------
# 품질은 저가주 컷이 아니라 '시총'으로 거릅니다(평평 스크리너와 동일 기준).
# 최저주가 $1은 서브-$1 페니주 데이터 노이즈만 막는 최소값. 정배열(이평선 위)
# 조건은 유지되므로 이 스크리너는 여전히 '상승추세 건전 베이스'만 봅니다.
min_price: 1
min_market_cap: 300000000
min_avg_dollar_volume_20d: 6000000
min_history_days: 200
# 죽은/딜 고정 종목 제외: 베이스 구간의 평균 |일간수익률|이 이 값 미만이면
# 가격이 거의 안 움직이는 것(예: M&A로 딜 가격에 고정) → 실제 횡보가 아니라
# 매매 불가한 '핀'으로 보고 제외. 0이면 비활성. (평평 스크리너와 동일)
min_base_daily_vol: 0.005

# --- 신규 상장주(IPO) 모드 -------------------------------------------
# 상장 1년 미만 종목은 150/200일선이 없어 Minervini 템플릿·200일 히스토리
# 게이트·Finviz "200일선 위" 필터에 전부 막혀 아예 안 잡혔습니다. IPO 모드는
# 별도 Finviz 조회(최근 상장, 200일선 요구 없음)로 유니버스에 넣고, 히스토리
# 게이트를 낮추고, "있는 이평선"으로 추세를 판정합니다. 베이스·VCP·거래량
# 품질 기준은 그대로 적용됩니다.
ipo:
  enabled: true
  min_history_days: 40           # 최소 40거래일(약 2개월)이면 후보로 허용
  short_history_threshold: 200   # 이 미만이면 단기 히스토리(IPO 적응) 모드
  finviz_ipo_date: "In the last year"   # 최근 상장 종목만 별도 조회

# --- 벤치마크 / 섹터 ETF --------------------------------------------
benchmarks: [SPY, QQQ, IWM]

# --- 베이스 탐지 -----------------------------------------------------
base:
  min_length_days: 20
  max_length_days: 120
  min_depth: 0.05
  max_depth: 0.35
  pivot_ready_threshold: 0.05    # pivot 대비 ±5% 이내 → ready
  pivot_watch_threshold: 0.10    # 10% 이내 → watch
  breakout_extended_threshold: 0.05  # pivot 돌파 후 +5% 초과 → extended

# --- Minervini Trend Template ---------------------------------------
trend_template:
  min_rs_percentile: 80
  min_price_vs_52w_low: 1.30
  min_price_vs_52w_high: 0.75

# --- Prior Uptrend ---------------------------------------------------
prior_uptrend:
  min_return: 0.25       # 20일전/120일전 - 1 >= 0.25 이면 통과

# --- 변동성 축소 / VCP ----------------------------------------------
volatility:
  atr_length: 10
  atr_contraction_threshold: 0.75   # <=0.75 통과, <=0.60 우수
  atr_contraction_excellent: 0.60
  range_contraction_threshold: 0.75
  recent_atr_compression: 0.80      # 최근10일 ATR < 최근50일 ATR * 0.8
  vcp_pass_ratio: 0.75              # range_3 <= range_1 * 0.75 통과
  vcp_excellent_ratio: 0.60         # range_3 <= range_1 * 0.60 우수

# --- 거래량 감소(Volume dry-up) -------------------------------------
volume:
  dry_up_10d_vs_50d: 0.80
  dry_up_5d_vs_50d: 0.70
  high_volume_down_day_move: -0.03   # -3% 이상 하락
  high_volume_down_day_threshold: 1.5  # 거래량 >= 50일평균 * 1.5
  high_volume_down_days_max: 2         # 최근20일 중 2회 이상이면 감점

# --- 50일선과의 거리 -------------------------------------------------
sma50:
  min_ratio: 0.95   # current >= SMA50 * 0.95
  max_ratio: 1.15   # current <= SMA50 * 1.15

# --- RS Line ---------------------------------------------------------
rs_line:
  near_high_ratio: 0.98   # rs_line >= rolling_max(252) * 0.98

# --- Sector Action ---------------------------------------------------
sector:
  near_high_ratio: 0.95   # 섹터 ETF 가 52주 신고가 대비 이 비율 이상이면 가산

# --- RS 백분위 합성 가중치 ------------------------------------------
rs_composite:
  w_3m: 0.4
  w_6m: 0.3
  w_12m: 0.3

# --- 점수 배점(합계 100) --------------------------------------------
scoring:
  trend_weight: 25
  rs_weight: 20
  base_weight: 25
  vcp_weight: 15
  volume_weight: 10
  sector_weight: 5
  # 등급 컷
  grade_prime: 85
  grade_high: 75
  grade_watch: 65

# --- 알림 ------------------------------------------------------------
alerts:
  ready_min_score: 75
  ready_max_distance_to_pivot: 0.05
  breakout_min_score: 75
  extended_pivot_ratio: 1.05   # current > pivot * 1.05
  extended_sma50_ratio: 1.20   # 또는 current > SMA50 * 1.20

# --- In-Base 건전도 점수 --------------------------------------------
# total_score(추세+RS 편중)와 별개로, "아직 조용히 베이스 중(분출 전)"을 재는 점수.
# 분출 기준은 엄격. 분출주는 숨기지 않고 점수만 낮게 나옴.
inbase:
  weights:
    not_extended: 30   # 안 뻗음(단기 extension 역점수)
    tightness: 25      # 타이트/변동성 축소
    volume: 15         # 거래량 마름
    support: 15        # 상승 지지선 위·정배열
    structure: 15      # 베이스 길이·깊이·higher low
  # extension 감점은 '베이스 이탈'만. 베이스 안에서의 분출은 감점하지 않는다(초기 진입).
  base_exit_frac: 1.03       # 현재가 > 베이스 고점 × 1.03 이면 상단 이탈로 감점
  max_ret_5d: 0.10           # (안전망) 베이스 없을 때만: 최근 5일 +10% 초과 → 감점
  pocket_pivot_lookback: 10  # 포켓피벗 판정: 직전 N일 하락일 거래량 기준(정보 표시용)
  max_ret_10d: 0.12          # (안전망) 베이스 없을 때만: 최근 10일 +12% 초과 → 감점
  sma50_stretch: 1.12
  tight_range: 0.08
  min_len: 20
  extended_cutoff: 0.5
  grades: {prime: 80, high: 65, watch: 50}
  # 저베타/잠자는 종목 페널티 (vigor = 베타 0.6 + 추력 0.4)
  beta_low: 1.0            # β ≥ 1.0 → 감점 없음
  beta_floor: 0.8         # β ≤ 0.8 → 베타 요인 0 (엄격)
  min_beta: 0.8           # β < 0.8 이고 추력도 약하면 목록에서 제외
  thrust_min_ret_12m: 0.30    # 12개월 +30% 미만이면 추력 약함
  thrust_min_from_low: 0.50   # 52주 저점 대비 +50% 미만이면 추력 약함
  vigor_min: 0.5          # In-Base × [0.5 .. 1.0]
  exclude_low_vigor: true

# 베이스 유형 태그 분류 기준 (우선순위: 타이트 → 평평 → ABC → 일반)
base_type:
  abc_min_depth: 0.22      # ABC: 깊은 조정(22%↑) + higher-low + 상단 반등만
  abc_min_position: 0.5    # 베이스 상단 절반(50%↑)까지 되돌린(반등) 것만 ABC
  tight_max_len: 50        # 타이트: 얕음 + 최근 매우 타이트
  tight_max_depth: 0.15
  tight_max_range: 0.07
  flat_min_len: 40         # 평평: 40일↑ + 얕음
  flat_max_depth: 0.15
