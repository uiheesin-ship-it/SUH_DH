# Render Blueprint — SUH_DH FastAPI 백엔드 하나를 무료 web service 로 띄웁니다.
# 정적 GitHub Pages 사이트가 임의 티커 조회와 Market Regime Lab 분석(/api/regime/*)에
# 이 백엔드를 사용합니다.
#
# One-time setup:
#   1) Push this file (already in the repo).
#   2) https://dashboard.render.com → New → Blueprint → connect this repo → Apply.
#   3) 배포된 URL 을 복사합니다 — 예: https://suh-dh-api.onrender.com
#   4) In GitHub: Settings → Secrets and variables → Actions → Variables →
#        SUH_DH_API_BASE = https://suh-dh-api.onrender.com
#   5) Actions → "Build & deploy dashboard" → Run workflow.
#
# Note: the free plan sleeps after ~15 min idle, so the first request after idle
# takes ~30-60s to wake (pages show a loading state). 로컬에서 ./run.sh 로 띄우면
# 이 서비스 없이 곧바로 동작합니다.
services:
  - type: web
    name: suh-dh-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Market Regime Lab 분석은 이 백엔드에서 돌아갑니다. 무료 인스턴스(512MB)에
      # 맞춰 bootstrap 반복수만 낮춘 설정을 씁니다 — 계산 방법은 동일합니다.
      - key: SUH_DH_REGIME_CONFIG
        value: deploy/regime_config.render.yaml

