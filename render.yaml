# ⚠ 주의: **지금 돌고 있는 백엔드는 이 파일이 만든 게 아닙니다.**
#
# 실제 백엔드는 Render 대시보드에서 수동으로 만든 `SUH_DH` 서비스이고
# (https://suh-dh.onrender.com), 이 파일이 정의하는 `suh-dh-api` 와 이름부터
# 다릅니다. 그래서 아래 buildFilter 는 실제 백엔드에 **적용되지 않습니다** —
# 그쪽 필터는 Render 대시보드의 Settings → Build Filters 에 있습니다.
#
# 이 블루프린트로 만들어졌던 서비스들(suh-dh-api, suh-dh-regime, 그리고 이름
# 충돌로 생긴 -drgl 중복본)은 아무도 쓰지 않으면서 커밋마다 빌드를 걸어
# 워크스페이스의 파이프라인 분을 다 먹었습니다. 그래서 지웠습니다.
#
# **이 파일을 Render 에 다시 Apply 하지 마세요.** 그러면 그 서비스들이 되살아납니다.
# 남겨 둔 이유는 백엔드를 처음부터 다시 세울 때의 참고(런타임·시작 명령·환경변수)
# 용도뿐입니다. 다시 세운다면 아래 name 을 실제 서비스 이름에 맞추고, 기존
# 서비스는 먼저 지우세요.
#
# ---------------------------------------------------------------------------
# Render Blueprint — SUH_DH FastAPI 백엔드 하나를 무료 web service 로 띄웁니다.
# 정적 GitHub Pages 사이트가 임의 티커 조회와 Market Regime Lab 분석(/api/regime/*)에
# 이 백엔드를 사용합니다.
#
# One-time setup:
#   1) Push this file (already in the repo).
#   2) https://dashboard.render.com → New → Blueprint → connect this repo → Apply.
#   3) 배포된 URL 을 복사합니다 — 예: https://suh-dh-api.onrender.com
#   4) In GitHub: Settings → Secrets and variables → Actions → Variables →
#        SUH_DH_API_BASE = https://suh-dh-api.onrender.com
#   5) Actions → "Build & deploy dashboard" → Run workflow.
#
# Note: the free plan sleeps after ~15 min idle, so the first request after idle
# takes ~30-60s to wake (pages show a loading state). 로컬에서 ./run.sh 로 띄우면
# 이 서비스 없이 곧바로 동작합니다.
services:
  - type: web
    name: suh-dh-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Market Regime Lab 분석은 이 백엔드에서 돌아갑니다. 무료 인스턴스(512MB)에
      # 맞춰 bootstrap 반복수만 낮춘 설정을 씁니다 — 계산 방법은 동일합니다.
      - key: SUH_DH_REGIME_CONFIG
        value: deploy/regime_config.render.yaml
    # 이 저장소는 데이터 파이프라인이기도 해서 기본 브랜치에 하루 50번 넘게 커밋이
    # 올라갑니다(52주 신고가 30분마다, 뉴스·DART·상관관계 등). 자동 배포를 그대로 두면
    # 백엔드가 그때마다 pip install 부터 다시 해서, 하루 종일 재시작 중인 서비스가 됩니다
    # — 깨어 있을 틈이 없고, 재시작마다 업로드 세션(메모리)이 날아갑니다.
    # 코드가 바뀔 때만 배포하도록 데이터 커밋은 빌드에서 제외합니다.
    #
    # **경로로 거르는 이 방식이 유일한 안전장치여야 합니다.** 예전에는 데이터 커밋
    # 메시지에 [skip render] 도 같이 붙였는데, 그건 경로를 안 보고 **그 푸시 전체**를
    # 건너뜁니다. 그래서 코드 머지 직후 데이터 커밋이 따라붙으면 새 코드가 통째로
    # 묻혔습니다 — 실제로 /api/fundamentals 라우트가 그렇게 배포되지 않아 화면이
    # 404 를 냈습니다. 표시는 걷어냈고, 아래 ignoredPaths 가 같은 일을 더 정확히 합니다
    # (데이터 커밋은 data/**·state/** 만 건드리므로 전부 여기에 걸립니다).
    buildFilter:
      ignoredPaths:
        - data/**          # 신고가·뉴스·DART·상관관계 등 자동 갱신 (하루 30회 이상)
        - state/**         # telegram 발송 기록
        - docs/**
        - site/**
        - "*.md"

